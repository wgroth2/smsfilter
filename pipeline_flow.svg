<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 760" width="100%" height="auto" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="startGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="decisionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="ignoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="skipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>

    <!-- Soft Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Canvas Border / Background -->
  <rect x="0" y="0" width="1260" height="760" fill="#ffffff"/>

  <!-- Title Header -->
  <rect x="20" y="12" width="1220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="630" y="44" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="800" letter-spacing="-0.2">SMS Filter — Complete Processing Pipeline Flow</text>

  <!-- Section Columns Background Cards -->
  <rect x="25" y="74" width="585" height="666" rx="12" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="317" y="98" text-anchor="middle" fill="#334155" font-size="13" font-weight="800" letter-spacing="0.5">STAGE 1: INGRESS &amp; OPT-OUT DETECTION</text>

  <rect x="635" y="74" width="600" height="666" rx="12" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="935" y="98" text-anchor="middle" fill="#334155" font-size="13" font-weight="800" letter-spacing="0.5">STAGE 2: AUTO-REPLY SAFETY GATES</text>

  <!-- ==================== LEFT COLUMN (STAGE 1) ==================== -->

  <!-- Node 1: Message Received -->
  <g filter="url(#cardShadow)">
    <rect x="150" y="116" width="335" height="46" rx="8" fill="url(#startGrad)" stroke="#2563eb" stroke-width="2"/>
    <text x="317" y="136" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">Message Received</text>
    <text x="317" y="152" text-anchor="middle" fill="#2563eb" font-size="11" font-weight="500">(Cellular SMS, MMS, or RCS Chat)</text>
  </g>

  <!-- Line 1 -> 2 -->
  <line x1="317" y1="162" x2="317" y2="186" stroke="#475569" stroke-width="2" marker-end="url(#arrow-neutral)"/>

  <!-- Node 2: Setup Finished? -->
  <g filter="url(#cardShadow)">
    <polygon points="317,186 447,216 317,246 187,216" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="317" y="220" text-anchor="middle" fill="#4c1d95" font-size="13" font-weight="700">Setup Finished?</text>
  </g>
  <line x1="447" y1="216" x2="507" y2="216" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="472" y="209" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">No</text>
  <g filter="url(#cardShadow)">
    <rect x="507" y="198" width="85" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="549" y="216" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="700">Drop</text>
    <text x="549" y="228" text-anchor="middle" fill="#64748b" font-size="9">(No log)</text>
  </g>

  <!-- Line 2 -> 3 -->
  <line x1="317" y1="246" x2="317" y2="272" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="329" y="262" fill="#059669" font-size="11" font-weight="700">Yes</text>

  <!-- Node 3: Stop-List Word? -->
  <g filter="url(#cardShadow)">
    <polygon points="317,272 452,302 317,332 182,302" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="317" y="299" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">Stop-List Keyword?</text>
    <text x="317" y="313" text-anchor="middle" fill="#6d28d9" font-size="10">(e.g. 'dyson', 'promo')</text>
  </g>
  <line x1="452" y1="302" x2="507" y2="302" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="474" y="295" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">Yes</text>
  <g filter="url(#cardShadow)">
    <rect x="507" y="284" width="85" height="36" rx="6" fill="url(#ignoreGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="549" y="302" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="700">Ignore</text>
    <text x="549" y="314" text-anchor="middle" fill="#b91c1c" font-size="9">Stop List</text>
  </g>

  <!-- Line 3 -> 4 -->
  <line x1="317" y1="332" x2="317" y2="358" stroke="#475569" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="329" y="348" fill="#475569" font-size="11" font-weight="700">No</text>

  <!-- Node 4: Google Contacts? -->
  <g filter="url(#cardShadow)">
    <polygon points="317,358 452,388 317,418 182,388" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="317" y="385" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">In Google Contacts?</text>
    <text x="317" y="399" text-anchor="middle" fill="#6d28d9" font-size="10">(Local real-time check)</text>
  </g>
  <line x1="452" y1="388" x2="507" y2="388" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="474" y="381" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">Yes</text>
  <g filter="url(#cardShadow)">
    <rect x="507" y="370" width="85" height="36" rx="6" fill="url(#ignoreGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="549" y="388" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="700">Ignore</text>
    <text x="549" y="400" text-anchor="middle" fill="#b91c1c" font-size="9">Contact</text>
  </g>

  <!-- Line 4 -> 5 -->
  <line x1="317" y1="418" x2="317" y2="444" stroke="#475569" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="329" y="434" fill="#475569" font-size="11" font-weight="700">No</text>

  <!-- Node 5: HubSpot Contact? -->
  <g filter="url(#cardShadow)">
    <polygon points="317,444 452,474 317,504 182,474" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="317" y="471" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">In HubSpot CRM?</text>
    <text x="317" y="485" text-anchor="middle" fill="#6d28d9" font-size="10">(If enabled in settings)</text>
  </g>
  <line x1="452" y1="474" x2="507" y2="474" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="474" y="467" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">Yes</text>
  <g filter="url(#cardShadow)">
    <rect x="507" y="456" width="85" height="36" rx="6" fill="url(#ignoreGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="549" y="474" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="700">Ignore</text>
    <text x="549" y="486" text-anchor="middle" fill="#b91c1c" font-size="9">HubSpot</text>
  </g>

  <!-- Line 5 -> 6 -->
  <line x1="317" y1="504" x2="317" y2="530" stroke="#475569" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="329" y="520" fill="#475569" font-size="11" font-weight="700">No</text>

  <!-- Node 6: Matches Pattern? -->
  <g filter="url(#cardShadow)">
    <polygon points="317,530 457,562 317,594 177,562" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="317" y="558" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">Matches Pattern?</text>
    <text x="317" y="573" text-anchor="middle" fill="#6d28d9" font-size="10">('STOP', 'stop to cancel', etc.)</text>
  </g>
  <line x1="457" y1="562" x2="507" y2="562" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="478" y="555" text-anchor="middle" fill="#64748b" font-size="11" font-weight="700">No</text>
  <g filter="url(#cardShadow)">
    <rect x="507" y="544" width="85" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="549" y="562" text-anchor="middle" fill="#334155" font-size="11" font-weight="700">No Action</text>
    <text x="549" y="574" text-anchor="middle" fill="#64748b" font-size="8">NO_MATCH</text>
  </g>

  <!-- Line 6 -> 7 (Yes) -->
  <line x1="317" y1="594" x2="317" y2="622" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="329" y="611" fill="#059669" font-size="11" font-weight="700">Yes</text>

  <!-- Node 7: Post Notification -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="622" width="355" height="42" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="317" y="643" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="700">🔔 Post System Notification</text>
    <text x="317" y="656" text-anchor="middle" fill="#0284c7" font-size="10">("Opt-out request detected")</text>
  </g>

  <!-- Cross-Column Bridge Arrow (Node 7 -> Gate 1) -->
  <path d="M 495 643 L 610 643 Q 625 643 625 600 L 625 139 Q 625 124 645 124 L 775 124" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrow-blue)"/>
  <text x="615" y="375" text-anchor="middle" fill="#0284c7" font-size="11" font-weight="700" transform="rotate(-90 615 375)">Proceed to Safety Gates</text>


  <!-- ==================== RIGHT COLUMN (STAGE 2) ==================== -->

  <!-- Node Gate 1: Auto-Reply Enabled? -->
  <g filter="url(#cardShadow)">
    <polygon points="925,100 1065,130 925,160 785,130" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="925" y="134" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">Gate 1: Auto-Reply On?</text>
  </g>
  <line x1="1065" y1="130" x2="1120" y2="130" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1090" y="123" text-anchor="middle" fill="#d97706" font-size="11" font-weight="700">No</text>
  <g filter="url(#cardShadow)">
    <rect x="1120" y="112" width="85" height="36" rx="6" fill="url(#skipGrad)" stroke="#d97706" stroke-width="1.5"/>
    <text x="1162" y="129" text-anchor="middle" fill="#92400e" font-size="10" font-weight="700">Skipped</text>
    <text x="1162" y="141" text-anchor="middle" fill="#b45309" font-size="9">Dry Run</text>
  </g>

  <!-- Line Gate 1 -> Gate 2 -->
  <line x1="925" y1="160" x2="925" y2="190" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="937" y="178" fill="#059669" font-size="11" font-weight="700">Yes</text>

  <!-- Node Gate 2: Group MMS? -->
  <g filter="url(#cardShadow)">
    <polygon points="925,190 1065,220 925,250 785,220" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="925" y="217" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">Gate 2: Group Thread?</text>
    <text x="925" y="231" text-anchor="middle" fill="#6d28d9" font-size="10">(Group MMS or Chat)</text>
  </g>
  <line x1="1065" y1="220" x2="1120" y2="220" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1090" y="213" text-anchor="middle" fill="#d97706" font-size="11" font-weight="700">Yes</text>
  <g filter="url(#cardShadow)">
    <rect x="1120" y="202" width="85" height="36" rx="6" fill="url(#skipGrad)" stroke="#d97706" stroke-width="1.5"/>
    <text x="1162" y="219" text-anchor="middle" fill="#92400e" font-size="10" font-weight="700">Skipped</text>
    <text x="1162" y="231" text-anchor="middle" fill="#b45309" font-size="9">Group MMS</text>
  </g>

  <!-- Line Gate 2 -> Gate 3 -->
  <line x1="925" y1="250" x2="925" y2="280" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="937" y="268" fill="#059669" font-size="11" font-weight="700">No</text>

  <!-- Node Gate 3: Can Receive SMS? -->
  <g filter="url(#cardShadow)">
    <polygon points="925,280 1065,310 925,340 785,310" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="925" y="307" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">Gate 3: Can Receive SMS?</text>
    <text x="925" y="321" text-anchor="middle" fill="#6d28d9" font-size="10">(Not alphanumeric ID)</text>
  </g>
  <line x1="1065" y1="310" x2="1120" y2="310" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1090" y="303" text-anchor="middle" fill="#d97706" font-size="11" font-weight="700">No</text>
  <g filter="url(#cardShadow)">
    <rect x="1120" y="292" width="85" height="36" rx="6" fill="url(#skipGrad)" stroke="#d97706" stroke-width="1.5"/>
    <text x="1162" y="309" text-anchor="middle" fill="#92400e" font-size="10" font-weight="700">Skipped</text>
    <text x="1162" y="321" text-anchor="middle" fill="#b45309" font-size="9">Alphanumeric</text>
  </g>

  <!-- Line Gate 3 -> Gate 4 -->
  <line x1="925" y1="340" x2="925" y2="370" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="937" y="358" fill="#059669" font-size="11" font-weight="700">Yes</text>

  <!-- Node Gate 4: 24h Cooldown? -->
  <g filter="url(#cardShadow)">
    <polygon points="925,370 1065,400 925,430 785,400" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="925" y="397" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">Gate 4: Replied in 24h?</text>
    <text x="925" y="411" text-anchor="middle" fill="#6d28d9" font-size="10">(Normalized phone hash)</text>
  </g>
  <line x1="1065" y1="400" x2="1120" y2="400" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1090" y="393" text-anchor="middle" fill="#d97706" font-size="11" font-weight="700">Yes</text>
  <g filter="url(#cardShadow)">
    <rect x="1120" y="382" width="85" height="36" rx="6" fill="url(#skipGrad)" stroke="#d97706" stroke-width="1.5"/>
    <text x="1162" y="399" text-anchor="middle" fill="#92400e" font-size="10" font-weight="700">Skipped</text>
    <text x="1162" y="411" text-anchor="middle" fill="#b45309" font-size="9">Cooldown</text>
  </g>

  <!-- Line Gate 4 -> Success -->
  <line x1="925" y1="430" x2="925" y2="472" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="937" y="454" fill="#059669" font-size="12" font-weight="700">No (All Passed)</text>

  <!-- Node Final: Send Reply -->
  <g filter="url(#cardShadow)">
    <rect x="745" y="472" width="360" height="74" rx="12" fill="url(#successGrad)" stroke="#059669" stroke-width="2.5"/>
    <text x="925" y="501" text-anchor="middle" fill="#065f46" font-size="16" font-weight="800">🚀 Send 'stop' or 'end' Reply</text>
    <text x="925" y="522" text-anchor="middle" fill="#047857" font-size="12" font-weight="600">Play audio alert + Record 24h cooldown hash</text>
    <text x="925" y="536" text-anchor="middle" fill="#059669" font-size="10">(Cellular SMS or RCS Direct Reply)</text>
  </g>

  <!-- Summary Legend / Highlights Box -->
  <g filter="url(#cardShadow)">
    <rect x="745" y="568" width="360" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="925" y="590" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Pipeline Execution Guarantees</text>
    <text x="765" y="610" fill="#475569" font-size="11">✓ Zero cloud syncing / private data retention</text>
    <text x="765" y="626" fill="#475569" font-size="11">✓ Local Google &amp; HubSpot CRM contact exemption</text>
    <text x="765" y="642" fill="#475569" font-size="11">✓ Multi-protocol (SMS, RCS, MMS) ingress tagging</text>
    <text x="765" y="656" fill="#475569" font-size="11">✓ Multi-channel deduplication &amp; normalized cooldown</text>
  </g>
</svg>
