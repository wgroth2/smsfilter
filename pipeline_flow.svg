<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="startGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="decisionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="ignoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="skipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>

    <!-- Soft Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="1200" height="52" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="600" y="34" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="800" letter-spacing="-0.2">SMS Filter — Complete Processing Pipeline Flow</text>

  <!-- Section Columns Background Cards -->
  <rect x="25" y="66" width="560" height="655" rx="14" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="305" y="92" text-anchor="middle" fill="#334155" font-size="14" font-weight="800" letter-spacing="0.5">STAGE 1: INGRESS &amp; OPT-OUT DETECTION</text>

  <rect x="615" y="66" width="560" height="655" rx="14" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="895" y="92" text-anchor="middle" fill="#334155" font-size="14" font-weight="800" letter-spacing="0.5">STAGE 2: AUTO-REPLY SAFETY GATES</text>

  <!-- ==================== LEFT COLUMN (STAGE 1) ==================== -->

  <!-- Node 1: Message Received -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="112" width="330" height="46" rx="8" fill="url(#startGrad)" stroke="#2563eb" stroke-width="2"/>
    <text x="305" y="132" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">Message Received</text>
    <text x="305" y="148" text-anchor="middle" fill="#2563eb" font-size="11" font-weight="500">(Cellular SMS, MMS, or RCS Chat)</text>
  </g>

  <!-- Line 1 -> 2 -->
  <line x1="305" y1="158" x2="305" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#arrow-neutral)"/>

  <!-- Node 2: Setup Finished? -->
  <g filter="url(#cardShadow)">
    <polygon points="305,182 435,212 305,242 175,212" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="305" y="216" text-anchor="middle" fill="#4c1d95" font-size="13" font-weight="700">Setup Finished?</text>
  </g>
  <line x1="435" y1="212" x2="495" y2="212" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="460" y="205" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">No</text>
  <g filter="url(#cardShadow)">
    <rect x="495" y="194" width="80" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="535" y="212" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="700">Drop</text>
    <text x="535" y="224" text-anchor="middle" fill="#64748b" font-size="9">(No log)</text>
  </g>

  <!-- Line 2 -> 3 -->
  <line x1="305" y1="242" x2="305" y2="268" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="317" y="258" fill="#059669" font-size="11" font-weight="700">Yes</text>

  <!-- Node 3: Stop-List Word? -->
  <g filter="url(#cardShadow)">
    <polygon points="305,268 440,298 305,328 170,298" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="305" y="295" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">Stop-List Keyword?</text>
    <text x="305" y="309" text-anchor="middle" fill="#6d28d9" font-size="10">(e.g. 'dyson', 'promo')</text>
  </g>
  <line x1="440" y1="298" x2="495" y2="298" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="462" y="291" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">Yes</text>
  <g filter="url(#cardShadow)">
    <rect x="495" y="280" width="80" height="36" rx="6" fill="url(#ignoreGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="535" y="298" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="700">Ignore</text>
    <text x="535" y="310" text-anchor="middle" fill="#b91c1c" font-size="9">Stop List</text>
  </g>

  <!-- Line 3 -> 4 -->
  <line x1="305" y1="328" x2="305" y2="354" stroke="#475569" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="317" y="344" fill="#475569" font-size="11" font-weight="700">No</text>

  <!-- Node 4: Google Contacts? -->
  <g filter="url(#cardShadow)">
    <polygon points="305,354 440,384 305,414 170,384" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="305" y="381" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">In Google Contacts?</text>
    <text x="305" y="395" text-anchor="middle" fill="#6d28d9" font-size="10">(Local real-time check)</text>
  </g>
  <line x1="440" y1="384" x2="495" y2="384" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="462" y="377" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">Yes</text>
  <g filter="url(#cardShadow)">
    <rect x="495" y="366" width="80" height="36" rx="6" fill="url(#ignoreGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="535" y="384" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="700">Ignore</text>
    <text x="535" y="396" text-anchor="middle" fill="#b91c1c" font-size="9">Contact</text>
  </g>

  <!-- Line 4 -> 5 -->
  <line x1="305" y1="414" x2="305" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="317" y="430" fill="#475569" font-size="11" font-weight="700">No</text>

  <!-- Node 5: HubSpot Contact? -->
  <g filter="url(#cardShadow)">
    <polygon points="305,440 440,470 305,500 170,470" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="305" y="467" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">In HubSpot CRM?</text>
    <text x="305" y="481" text-anchor="middle" fill="#6d28d9" font-size="10">(If enabled in settings)</text>
  </g>
  <line x1="440" y1="470" x2="495" y2="470" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="462" y="463" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">Yes</text>
  <g filter="url(#cardShadow)">
    <rect x="495" y="452" width="80" height="36" rx="6" fill="url(#ignoreGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="535" y="470" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="700">Ignore</text>
    <text x="535" y="482" text-anchor="middle" fill="#b91c1c" font-size="9">HubSpot</text>
  </g>

  <!-- Line 5 -> 6 -->
  <line x1="305" y1="500" x2="305" y2="526" stroke="#475569" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="317" y="516" fill="#475569" font-size="11" font-weight="700">No</text>

  <!-- Node 6: Matches Pattern? -->
  <g filter="url(#cardShadow)">
    <polygon points="305,526 445,558 305,590 165,558" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="305" y="554" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">Matches Pattern?</text>
    <text x="305" y="569" text-anchor="middle" fill="#6d28d9" font-size="10">('STOP', 'stop to cancel', etc.)</text>
  </g>
  <line x1="445" y1="558" x2="495" y2="558" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="466" y="551" text-anchor="middle" fill="#64748b" font-size="11" font-weight="700">No</text>
  <g filter="url(#cardShadow)">
    <rect x="495" y="540" width="80" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="535" y="558" text-anchor="middle" fill="#334155" font-size="11" font-weight="700">No Action</text>
    <text x="535" y="570" text-anchor="middle" fill="#64748b" font-size="8">NO_MATCH</text>
  </g>

  <!-- Line 6 -> 7 (Yes) -->
  <line x1="305" y1="590" x2="305" y2="618" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="317" y="607" fill="#059669" font-size="11" font-weight="700">Yes</text>

  <!-- Node 7: Post Notification -->
  <g filter="url(#cardShadow)">
    <rect x="130" y="618" width="350" height="42" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="305" y="639" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="700">🔔 Post System Notification</text>
    <text x="305" y="652" text-anchor="middle" fill="#0284c7" font-size="10">("Opt-out request detected")</text>
  </g>

  <!-- Cross-Column Bridge Arrow (Node 7 -> Gate 1) -->
  <path d="M 480 639 L 585 639 Q 600 639 600 600 L 600 135 Q 600 120 620 120 L 730 120" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrow-blue)"/>
  <text x="590" y="375" text-anchor="middle" fill="#0284c7" font-size="11" font-weight="700" transform="rotate(-90 590 375)">Proceed to Safety Gates</text>


  <!-- ==================== RIGHT COLUMN (STAGE 2) ==================== -->

  <!-- Node Gate 1: Auto-Reply Enabled? -->
  <g filter="url(#cardShadow)">
    <polygon points="885,96 1025,126 885,156 745,126" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="885" y="130" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">Gate 1: Auto-Reply On?</text>
  </g>
  <line x1="1025" y1="126" x2="1080" y2="126" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1050" y="119" text-anchor="middle" fill="#d97706" font-size="11" font-weight="700">No</text>
  <g filter="url(#cardShadow)">
    <rect x="1080" y="108" width="85" height="36" rx="6" fill="url(#skipGrad)" stroke="#d97706" stroke-width="1.5"/>
    <text x="1122" y="125" text-anchor="middle" fill="#92400e" font-size="10" font-weight="700">Skipped</text>
    <text x="1122" y="137" text-anchor="middle" fill="#b45309" font-size="9">Dry Run</text>
  </g>

  <!-- Line Gate 1 -> Gate 2 -->
  <line x1="885" y1="156" x2="885" y2="186" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="897" y="174" fill="#059669" font-size="11" font-weight="700">Yes</text>

  <!-- Node Gate 2: Group MMS? -->
  <g filter="url(#cardShadow)">
    <polygon points="885,186 1025,216 885,246 745,216" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="885" y="213" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">Gate 2: Group Thread?</text>
    <text x="885" y="227" text-anchor="middle" fill="#6d28d9" font-size="10">(Group MMS or Chat)</text>
  </g>
  <line x1="1025" y1="216" x2="1080" y2="216" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1050" y="209" text-anchor="middle" fill="#d97706" font-size="11" font-weight="700">Yes</text>
  <g filter="url(#cardShadow)">
    <rect x="1080" y="198" width="85" height="36" rx="6" fill="url(#skipGrad)" stroke="#d97706" stroke-width="1.5"/>
    <text x="1122" y="215" text-anchor="middle" fill="#92400e" font-size="10" font-weight="700">Skipped</text>
    <text x="1122" y="227" text-anchor="middle" fill="#b45309" font-size="9">Group MMS</text>
  </g>

  <!-- Line Gate 2 -> Gate 3 -->
  <line x1="885" y1="246" x2="885" y2="276" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="897" y="264" fill="#059669" font-size="11" font-weight="700">No</text>

  <!-- Node Gate 3: Can Receive SMS? -->
  <g filter="url(#cardShadow)">
    <polygon points="885,276 1025,306 885,336 745,306" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="885" y="303" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">Gate 3: Can Receive SMS?</text>
    <text x="885" y="317" text-anchor="middle" fill="#6d28d9" font-size="10">(Not alphanumeric ID)</text>
  </g>
  <line x1="1025" y1="306" x2="1080" y2="306" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1050" y="299" text-anchor="middle" fill="#d97706" font-size="11" font-weight="700">No</text>
  <g filter="url(#cardShadow)">
    <rect x="1080" y="288" width="85" height="36" rx="6" fill="url(#skipGrad)" stroke="#d97706" stroke-width="1.5"/>
    <text x="1122" y="305" text-anchor="middle" fill="#92400e" font-size="10" font-weight="700">Skipped</text>
    <text x="1122" y="317" text-anchor="middle" fill="#b45309" font-size="9">Alphanumeric</text>
  </g>

  <!-- Line Gate 3 -> Gate 4 -->
  <line x1="885" y1="336" x2="885" y2="366" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="897" y="354" fill="#059669" font-size="11" font-weight="700">Yes</text>

  <!-- Node Gate 4: 24h Cooldown? -->
  <g filter="url(#cardShadow)">
    <polygon points="885,366 1025,396 885,426 745,396" fill="url(#decisionGrad)" stroke="#7c3aed" stroke-width="2"/>
    <text x="885" y="393" text-anchor="middle" fill="#4c1d95" font-size="12" font-weight="700">Gate 4: Replied in 24h?</text>
    <text x="885" y="407" text-anchor="middle" fill="#6d28d9" font-size="10">(Normalized phone hash)</text>
  </g>
  <line x1="1025" y1="396" x2="1080" y2="396" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1050" y="389" text-anchor="middle" fill="#d97706" font-size="11" font-weight="700">Yes</text>
  <g filter="url(#cardShadow)">
    <rect x="1080" y="378" width="85" height="36" rx="6" fill="url(#skipGrad)" stroke="#d97706" stroke-width="1.5"/>
    <text x="1122" y="395" text-anchor="middle" fill="#92400e" font-size="10" font-weight="700">Skipped</text>
    <text x="1122" y="407" text-anchor="middle" fill="#b45309" font-size="9">Cooldown</text>
  </g>

  <!-- Line Gate 4 -> Success -->
  <line x1="885" y1="426" x2="885" y2="470" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="897" y="452" fill="#059669" font-size="12" font-weight="700">No (All Passed)</text>

  <!-- Node Final: Send Reply -->
  <g filter="url(#cardShadow)">
    <rect x="705" y="470" width="360" height="74" rx="12" fill="url(#successGrad)" stroke="#059669" stroke-width="2.5"/>
    <text x="885" y="499" text-anchor="middle" fill="#065f46" font-size="16" font-weight="800">🚀 Send 'stop' or 'end' Reply</text>
    <text x="885" y="520" text-anchor="middle" fill="#047857" font-size="12" font-weight="600">Play audio alert + Record 24h cooldown hash</text>
    <text x="885" y="534" text-anchor="middle" fill="#059669" font-size="10">(Cellular SMS or RCS Direct Reply)</text>
  </g>

  <!-- Summary Legend / Highlights Box -->
  <g filter="url(#cardShadow)">
    <rect x="705" y="570" width="360" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="885" y="592" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Pipeline Execution Guarantees</text>
    <text x="725" y="612" fill="#475569" font-size="11">✓ Zero cloud syncing / private data retention</text>
    <text x="725" y="628" fill="#475569" font-size="11">✓ Local Google &amp; HubSpot CRM contact exemption</text>
    <text x="725" y="644" fill="#475569" font-size="11">✓ Multi-protocol (SMS, RCS, MMS) ingress tagging</text>
  </g>
</svg>
