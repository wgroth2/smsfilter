# Project-wide Gradle settings.

# Increase the daemon heap; KSP + Hilt + Room annotation processing is memory-hungry.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run independent tasks in parallel and reuse build outputs where possible.
org.gradle.parallel=true
org.gradle.caching=true

# Required: this project uses AndroidX (Jetpack) rather than the legacy support library.
android.useAndroidX=true

# Each module gets its own R class containing only its own resources, rather than also
# inheriting its dependencies' resources.
android.nonTransitiveRClass=true

# Use the official Kotlin code style.
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
